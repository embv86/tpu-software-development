server:
  port: 8084

spring:
  application:
    name: image-service

  datasource:
    url: jdbc:postgresql://marketplace-db:5432/image_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 100MB

  server:
    tomcat:
      max-swallow-size: 30MB
      max-http-form-post-size: 30MB

  rabbitmq:
    host: marketplace-rabbitmq
    port: 5672
    username: guest
    password: guest

minio:
  endpoint: http://marketplace-minio:9000
  accessKey: minioadmin
  secretKey: minioadmin
  buckets:
    raw: raw-images
    processed: market-images

image:
  target-width: 1200
  jpeg-quality: 0.80