server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        # Маршрут 1: Логин и регистрация (Фильтр НЕ нужен, доступ открыт)
        - id: user-auth-route
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/auth/**

        # Маршрут 2: Защищенные профили (Применяем JwtAuthenticationFilter)
        - id: user-profile-route
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - JwtAuthenticationFilter # Наш кастомный фильтр безопасности

