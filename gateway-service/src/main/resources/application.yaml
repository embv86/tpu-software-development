server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service

  codec:
    max-in-memory-size: 40MB

  web:
    resources:
      max-in-memory-size: 40MB

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: user-auth-route
          uri: ${USER_SERVICE_URI:http://user-service:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: user-profile-route
          uri: ${USER_SERVICE_URI:http://user-service:8081}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - JwtAuthenticationFilter

        - id: listing-route
          uri: ${LISTING_SERVICE_URI:http://listing-service:8082}
          predicates:
            - Path=/api/v1/listings/**
          filters:
            - JwtAuthenticationFilter

        - id: image-service
          uri: ${IMAGE_SERVICE_URI:http://image-service:8084}
          predicates:
            - Path=/api/v1/images/**
          filters:
            - JwtAuthenticationFilter

        - id: chat-service
          uri: ${CHAT_SERVICE_URI:http://chat-service:8085}
          predicates:
            - Path=/api/v1/chats/**
          # filters:
          #   - JwtAuthenticationFilter

        - id: notification-websocket
          uri: ${NOTIFICATION_SERVICE_URI:ws://notification-service:8086}
          predicates:
            - Path=/ws-notifications/**
          filters:
            - PreserveHostHeader

