server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: user-auth-route
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: user-profile-route
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - JwtAuthenticationFilter

        # НАШ НОВЫЙ МАРШРУТ ДЛЯ ОБЪЯВЛЕНИЙ
        - id: listing-route
          uri: http://listing-service:8082
          predicates:
            - Path=/api/v1/listings/**
          filters:
            - JwtAuthenticationFilter

