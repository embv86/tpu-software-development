server:
  port: 8080

spring:
  application:
    name: gateway-service

  codec:
    max-in-memory-size: 40MB

  web:
    resources:
      max-in-memory-size: 40MB


  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: user-auth-route
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: user-profile-route
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - JwtAuthenticationFilter

        - id: listing-route
          uri: http://listing-service:8082
          predicates:
            - Path=/api/v1/listings/**
          filters:
            - JwtAuthenticationFilter

        - id: image-service
          uri: http://image-service:8084
          predicates:
            - Path=/api/v1/images/**
          filters:
            - JwtAuthenticationFilter

        - id: chat-service
          uri: http://marketplace-chat-service:8085
          predicates:
            - Path=/api/v1/chats/**
          # filters:
          #   - JwtAuthenticationFilter
