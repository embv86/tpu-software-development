databaseChangeLog:
  - changeSet:
      id: 2
      author: embv86
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: images
      changes:
        - createTable:
            tableName: images
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: file_id
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: raw_url
                  type: varchar(512)
              - column:
                  name: processed_url
                  type: varchar(512)
              - column:
                  name: listing_id
                  type: bigint
              - column:
                  name: created_at
                  type: timestamp
