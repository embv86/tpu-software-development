services:
  postgres-users:
    image: postgres:16-alpine
    container_name: marketplace-users-db
    environment:
      POSTGRES_DB: marketplace_users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata_users:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace_users_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-listings:
    image: postgres:16-alpine
    container_name: marketplace-listings-db
    environment:
      POSTGRES_DB: marketplace_listings_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata_listings:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace_listings_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=user-service
    container_name: marketplace-user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-users:5432/marketplace_users_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      postgres-users:
        condition: service_healthy

  listing-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=listing-service
    container_name: marketplace-listing-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-listings:5432/marketplace_listings_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      postgres-listings:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=gateway-service
    container_name: marketplace-gateway-service
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - listing-service

volumes:
  pgdata_users:
  pgdata_listings: