services:
  postgres-users:
    image: postgres:16-alpine
    container_name: marketplace-users-db
    environment:
      POSTGRES_DB: ${POSTGRES_USERS_DB}
      POSTGRES_USER: ${POSTGRES_USERS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USERS_PASSWORD}
    ports:
      - "${POSTGRES_USERS_PORT}:5432"
    volumes:
      - pgdata_users:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERS_USER} -d ${POSTGRES_USERS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-listings:
    image: postgres:16-alpine
    container_name: marketplace-listings-db
    environment:
      POSTGRES_DB: ${POSTGRES_LISTINGS_DB}
      POSTGRES_USER: ${POSTGRES_LISTINGS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_LISTINGS_PASSWORD}
    ports:
      - "${POSTGRES_LISTINGS_PORT}:5432"
    volumes:
      - pgdata_listings:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_LISTINGS_USER} -d ${POSTGRES_LISTINGS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-chats:
    image: postgres:16-alpine
    container_name: marketplace-chats-db
    environment:
      POSTGRES_DB: ${POSTGRES_CHATS_DB}
      POSTGRES_USER: ${POSTGRES_CHATS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CHATS_PASSWORD}
    ports:
      - "${POSTGRES_CHATS_PORT}:5432"
    volumes:
      - pgdata_chats:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_CHATS_USER} -d ${POSTGRES_CHATS_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: marketplace-rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: marketplace-minio
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5

  image-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=image-service
    container_name: marketplace-image-service
    ports:
      - "${IMAGE_SERVICE_PORT}:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-listings:5432/${POSTGRES_LISTINGS_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_LISTINGS_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_LISTINGS_PASSWORD}
      - MINIO_BUCKETS_RAW=${MINIO_BUCKET_RAW}
      - MINIO_BUCKETS_PROCESSED=${MINIO_BUCKET_PROCESSED}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      postgres-listings:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=user-service
    container_name: marketplace-user-service
    ports:
      - "${USER_SERVICE_PORT}:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-users:5432/${POSTGRES_USERS_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USERS_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_USERS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres-users:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  listing-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=listing-service
    container_name: marketplace-listing-service
    ports:
      - "${LISTING_SERVICE_PORT}:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-listings:5432/${POSTGRES_LISTINGS_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_LISTINGS_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_LISTINGS_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      postgres-listings:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=gateway-service
    container_name: marketplace-gateway-service
    ports:
      - "${GATEWAY_SERVICE_PORT}:8080"
    depends_on:
      - user-service
      - listing-service

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=chat-service
    container_name: marketplace-chat-service
    ports:
      - "${CHAT_SERVICE_PORT}:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-chats:5432/${POSTGRES_CHATS_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_CHATS_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_CHATS_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      postgres-chats:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=notification-service
    container_name: marketplace-notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:8086"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketplace-frontend
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - gateway-service

volumes:
  pgdata_users:
  pgdata_listings:
  pgdata_chats:
  minio_data: